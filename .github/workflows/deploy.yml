name: Deploy para Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build e deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Build binário
        run: GOOS=linux GOARCH=amd64 go build -o battleship .

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ vars.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Enviar binário e assets
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            battleship static \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/

      - name: Reiniciar serviço
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "chmod +x ${{ vars.DEPLOY_PATH }}/battleship && XDG_RUNTIME_DIR=/run/user/\$(id -u) systemctl --user restart battlefield"

      - name: Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
